name: Release

# 推送 v* 标签（版本号需与 package.json 一致）即构建、签名并发布 Release，
# 附带 Tauri updater 使用的 latest.json。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      probe_only:
        description: 只探测镜像桶，不构建、不发布
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # 顺序：Android → Windows → macOS。正式版直接发布，桌面安装包补到同一条 Release。
  android:
    if: ${{ !endsWith(github.ref_name, '-widget') && !inputs.probe_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release already exists"
            exit 0
          fi
          printf '%s\n' \
            '- 可根据手机记录补近三天，标题默认用应用名，只记一次' \
            '- 补过的排在后面，并标出已补录' \
            '- 新建是矮抽屉，左右两张入口：新建日程、补录日程' \
            '- 游戏改成娱乐，并加了社交' \
            '- 设置里可改标签显示名；号码名单在数据里' \
            '- 列表可按标签、归属、仅一次或重复来筛选，按开始时间排序' \
            '- 周视图里短安排和正课并排：正课缩短靠右，短名字放不下用省略号，圆点贴在淡底上' \
            > /tmp/release-notes.md
          gh release create "$TAG" \
            --title "小日程 v0.3.0" \
            --target "$GITHUB_SHA" \
            --notes-file /tmp/release-notes.md
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Bundle semver
        run: node scripts/prepare-bundle-version.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build APK
        run: npm run tauri android build -- --apk --config src-tauri/ci-version.json
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "ScheduleMINI-${VERSION}-universal.apk"
          TAG="v${VERSION}"
          gh release upload "$TAG" "ScheduleMINI-${VERSION}-universal.apk" --clobber

  windows:
    needs: android
    if: ${{ !endsWith(github.ref_name, '-widget') && !inputs.probe_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Bundle semver
        run: node scripts/prepare-bundle-version.mjs
      - name: Asset name pattern
        id: names
        shell: bash
        run: echo "pattern=ScheduleMINI-$(node -p "require('./package.json').version")-[arch][setup][ext]" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 小日程 v0.3.0
          releaseBody: |
            - 可根据手机记录补近三天，标题默认用应用名，只记一次
            - 补过的排在后面，并标出已补录
            - 新建是矮抽屉，左右两张入口：新建日程、补录日程
            - 游戏改成娱乐，并加了社交
            - 设置里可改标签显示名；号码名单在数据里
            - 列表可按标签、归属、仅一次或重复来筛选，按开始时间排序
            - 周视图里短安排和正课并排：正课缩短靠右，短名字放不下用省略号，圆点贴在淡底上
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          assetNamePattern: ${{ steps.names.outputs.pattern }}
          args: --config src-tauri/ci-version.json

  macos:
    needs: windows
    if: ${{ !endsWith(github.ref_name, '-widget') && !inputs.probe_only }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Bundle semver
        run: node scripts/prepare-bundle-version.mjs
      - name: Asset name pattern
        id: names
        shell: bash
        run: echo "pattern=ScheduleMINI-$(node -p "require('./package.json').version")-[arch][setup][ext]" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 小日程 v0.3.0
          releaseBody: |
            - 可根据手机记录补近三天，标题默认用应用名，只记一次
            - 补过的排在后面，并标出已补录
            - 新建是矮抽屉，左右两张入口：新建日程、补录日程
            - 游戏改成娱乐，并加了社交
            - 设置里可改标签显示名；号码名单在数据里
            - 列表可按标签、归属、仅一次或重复来筛选，按开始时间排序
            - 周视图里短安排和正课并排：正课缩短靠右，短名字放不下用省略号，圆点贴在淡底上
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          assetNamePattern: ${{ steps.names.outputs.pattern }}
          args: --config src-tauri/ci-version.json --target universal-apple-darwin
      - name: Updater manifest is on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release view "v${VERSION}" --json assets --jq '.assets[].name' | grep -qx latest.json

  # GitHub Release 已经发布之后才上传镜像。密钥没配齐就跳过；
  # 密钥在且上传失败则本 job 失败（没有 continue-on-error），前面的 Release 资产仍留在 GitHub。
  # 预发布/含连字符标签（如 v0.3.0-beta.1）不写 Sealos latest，避免盖掉正式版。
  mirror:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Upload release assets to Sealos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_S3_SECRET_KEY }}
          MIRROR_S3_ENDPOINT: ${{ secrets.MIRROR_S3_ENDPOINT }}
          MIRROR_S3_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          MIRROR_PUBLIC_BASE: ${{ secrets.MIRROR_PUBLIC_BASE }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${MIRROR_S3_ENDPOINT}" ] && missing+=("MIRROR_S3_ENDPOINT")
          [ -z "${MIRROR_S3_BUCKET}" ] && missing+=("MIRROR_S3_BUCKET")
          [ -z "${MIRROR_PUBLIC_BASE}" ] && missing+=("MIRROR_PUBLIC_BASE")
          [ -z "${AWS_ACCESS_KEY_ID}" ] && missing+=("MIRROR_S3_ACCESS_KEY")
          [ -z "${AWS_SECRET_ACCESS_KEY}" ] && missing+=("MIRROR_S3_SECRET_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "mirror upload skipped, missing: ${missing[*]}"
            exit 0
          fi
          app_base=$(node -e "
            const fs = require('fs');
            const s = fs.readFileSync('src/lib/update/mirror-endpoints.ts','utf8');
            const m = s.match(/MIRROR_PUBLIC_BASE\\s*=\\s*\"([^\"]+)\"/);
            if (!m) process.exit(1);
            process.stdout.write(m[1]);
          ")
          if [ "${MIRROR_PUBLIC_BASE%/}" != "$app_base" ]; then
            echo "MIRROR_PUBLIC_BASE does not match the in-app mirror host"
            exit 1
          fi
          # shellcheck disable=SC1091
          source scripts/mirror-s3.sh
          mirror_s3_setup
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          mkdir -p assets
          gh release download "$TAG" --dir assets --clobber
          test -f assets/latest.json
          node scripts/mirror-manifests.mjs rewrite-latest \
            assets/latest.json "$MIRROR_PUBLIC_BASE" "$VERSION" assets/mirror-latest.json
          shopt -s nullglob
          apks=(assets/*universal*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            apks=(assets/*.apk)
          fi
          test "${#apks[@]}" -gt 0
          apk="${apks[0]}"
          sha=$(sha256sum "$apk" | awk '{print $1}')
          gh release view "$TAG" --json body --jq '.body // ""' > assets/notes.md
          node scripts/mirror-manifests.mjs android-manifest \
            "$MIRROR_PUBLIC_BASE" "$VERSION" "$(basename "$apk")" "$sha" assets/notes.md \
            assets/android-latest.json
          prefix="schedulemini/v${VERSION}"
          for f in assets/*; do
            base=$(basename "$f")
            case "$base" in
              latest.json|mirror-latest.json|android-latest.json|notes.md) continue ;;
            esac
            ctype=$(node scripts/mirror-manifests.mjs content-type "$base")
            mirror_s3_put "${prefix}/${base}" "$f" "$ctype" \
              "public, max-age=31536000, immutable" \
              "attachment; filename=\"${base}\""
          done
          mirror_s3_put "schedulemini/latest.json" assets/mirror-latest.json \
            "application/json" "no-cache"
          mirror_s3_put "schedulemini/android-latest.json" assets/android-latest.json \
            "application/json" "no-cache"
          echo "mirrored ${prefix} and schedulemini/latest.json schedulemini/android-latest.json"

  # 新 workflow 文件在合进 main 之前不能单独 workflow_dispatch。
  # Release 这个文件已经在 main 上，所以用 probe_only 在功能分支上探测同一个上传路径。
  probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload, fetch, and delete a probe object
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_S3_SECRET_KEY }}
          MIRROR_S3_ENDPOINT: ${{ secrets.MIRROR_S3_ENDPOINT }}
          MIRROR_S3_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          MIRROR_PUBLIC_BASE: ${{ secrets.MIRROR_PUBLIC_BASE }}
        run: bash scripts/mirror-probe.sh
