name: Release

# 推送 v* 标签（版本号需与 package.json 一致）即构建、签名并发布 Release，
# 附带 Tauri updater 使用的 latest.json。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Bundle semver
        run: node scripts/prepare-bundle-version.mjs
      - name: Asset name pattern
        id: names
        shell: bash
        run: echo "pattern=ScheduleMINI-$(node -p "require('./package.json').version")-[arch][setup][ext]" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 小日程 ${{ github.ref_name }}
          releaseBody: |
            - 调休上班日会显示工作周循环
            - 周视图和聚焦悬浮窗按标签分色，归属留在边上
            - 共同按钮对比更清楚，星期从周一开始
            - 中继地址空着时只显示占位，手机上地址完整换行
            - 手机上较短的日程卡片显示备注，长标题换行
            - 同步失败时整句都看得到。中继拒收的提示是「同步失败：中继拒收，稍后重试」
            - 结束共处可以选择记入并结束、只结束，或继续
            - 按 Esc 关闭新建和设置
            - 导入的内容不是 JSON 时，只提示「导入失败：配置不是合法 JSON」
            - 取消过一次的周循环，可以删掉整段
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: ${{ steps.names.outputs.pattern }}
          args: --config src-tauri/ci-version.json ${{ matrix.args }}

  android:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Bundle semver
        run: node scripts/prepare-bundle-version.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build APK
        run: npm run tauri android build -- --apk --config src-tauri/ci-version.json
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "ScheduleMINI-${VERSION}-universal.apk"
          gh release upload "v${VERSION}" "ScheduleMINI-${VERSION}-universal.apk" --clobber
          gh release view "v${VERSION}" --json assets --jq '.assets[].name' | grep -qx latest.json
