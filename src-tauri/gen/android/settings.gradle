include ':widget-render'

def requested = gradle.startParameter.taskNames
def widgetOnly = !requested.isEmpty() && requested.every { it.contains('widget-render') }
if (!widgetOnly) {
    include ':app'
    def tauriSettings = new File(settingsDir, 'tauri.settings.gradle')
    if (tauriSettings.exists()) {
        apply from: tauriSettings
    }
}
